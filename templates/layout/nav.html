<div class="container my-5">

      <span class="navbar-brand fw-bold text-secondary">Menú principal</span>
      <ul class="navbar-nav d-flex flex-row gap-3">

        <li class="nav-item">
          <a class="nav-link fw-semibold {% if request.endpoint == 'about' %}active text-dark{% else %}text-primary{% endif %}" href="{{ url_for('about') }}">Acerca</a>
        </li>

        <li class="nav-item">
          <a class="nav-link fw-semibold {% if request.endpoint == 'contacto' %}active text-dark{% else %}text-primary{% endif %}" href="{{ url_for('contacto') }}">Contacto</a>

        <li class="nav-item">
          <a class="nav-link fw-semibold {% if request.endpoint == 'tienda' %}active text-dark{% else %}text-primary{% endif %}" href="{{ url_for('tienda') }}">Tienda</a>

        <li class="nav-item">

        <li class="nav-item">

<li class="nav-item">
